name: Tests

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - "repository.json"
      - "LICENSE"
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - "repository.json"
      - "LICENSE"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # The job only reads the repo — no packages, no PR writes. Every other
    # workflow here scopes its token per-job; this one was missed, which
    # CodeQL flagged on #306 (actions/missing-workflow-permissions).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the python3 shipped in the HA base image (Alpine 3.20)
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker/requirements.txt

      - name: Install libpulse
        # pulsectl dlopen()s libpulse.so.0 at import time, so anything
        # importing bt_audio_manager.audio (or manager) needs it present.
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      - name: Install dependencies
        # PyYAML is installed here rather than via requirements.txt because
        # the image gets it from the py3-yaml apk package (no musl wheel for
        # armv7). Without it, tests/test_openapi_spec.py silently skips.
        run: pip install -r docker/requirements.txt pyyaml

      - name: Byte-compile all sources
        run: python -m compileall -q src tests

      - name: Check every module imports
        # Tests skip themselves when libpulse is missing so contributors on
        # macOS aren't blocked; this step makes sure that never silently
        # hides a broken import in CI.
        env:
          PYTHONPATH: src
        run: |
          python -c "
          import importlib, pkgutil
          import bt_audio_manager
          for m in pkgutil.walk_packages(bt_audio_manager.__path__, 'bt_audio_manager.'):
              importlib.import_module(m.name)
              print('ok', m.name)
          "

      - name: Run unit tests
        env:
          PYTHONPATH: src
        # -t . so the tests package __init__ runs (it silences add-on logging)
        run: python -m unittest discover -s tests -t . -v

      - name: Run frontend escaping tests
        # Device names come from Bluetooth advertisements and are rendered
        # into innerHTML, so the escaping in app.js is a security control.
        # Bare node, no toolchain or dependencies required.
        run: node tests/js/test_escaping.js
